name: Test Bandcamp Discovery

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bandcamp library
        run: npm install --no-save bandcamp-fetch

      - name: Run Bandcamp test
        run: node bandcamp-test.js
