name: Update Concert Listings

on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch concert listings
        env:
          JAMBASE_API_KEY: ${{ secrets.JAMBASE_API_KEY }}
        run: python scripts/update_concerts.py

      - name: Save updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts.json
          if ! git diff --cached --quiet; then
            git commit -m "Update concert listings"
            git push
          fi
